[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The cadrender contributors"]
repository = "https://github.com/hameddavodi/cadrender"
homepage = "https://github.com/hameddavodi/cadrender"
keywords = ["dxf", "dwg", "cad", "svg", "png"]
categories = ["rendering", "graphics", "parser-implementations"]

[workspace.dependencies]
cadrender-core = { path = "crates/cadrender-core", version = "0.1.0" }
cadrender-dxf = { path = "crates/cadrender-dxf", version = "0.1.0" }
cadrender-raster = { path = "crates/cadrender-raster", version = "0.1.0" }
cadrender = { path = "crates/cadrender", version = "0.1.0" }
cadrender-dwg = { path = "crates/cadrender-dwg", version = "0.1.0" }
cadrender-dwg-scene = { path = "crates/cadrender-dwg-scene", version = "0.1.0" }
cadrender-acis = { path = "crates/cadrender-acis", version = "0.1.0" }
cadrender-image = { path = "crates/cadrender-image", version = "0.1.0" }
cadrender-svg = { path = "crates/cadrender-svg", version = "0.1.0" }
memmap2 = "0.9"
memchr = "2"
rayon = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
png = "0.17"
ttf-parser = "0.25"

# Fast release build: this is what is measured and shipped.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Development: our code builds fast, dependencies (tiny-skia, png) are optimised,
# so tests on real drawings do not crawl.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
